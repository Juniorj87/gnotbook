<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#08080b">
<meta name="description" content="Morrow — NFT marketplace for Gno.land. Collect, mint and trade editions through your Adena wallet. IPFS-pinned art, on-chain registry, no fake listings.">
<title>Morrow — NFT marketplace on Gno.land</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
<script defer src="/app.js"></script>
</head>
<body>
<div class="ambient ambient-a"></div><div class="ambient ambient-b"></div>
<header class="topbar">
  <a class="brand" href="#explore" aria-label="Morrow home">
    <span class="brand-mark"><span></span></span>
    <span class="brand-word">morrow<span class="brand-dot">.</span></span>
  </a>
  <nav class="main-nav" aria-label="Main navigation">
    <button class="nav-link active" data-route="explore">Explore</button>
    <button class="nav-link" data-action="open-moonbound-drop">Drops</button>
    <button class="nav-link" data-route="collections">Collections</button>
    <button class="nav-link" data-route="activity">Activity</button>
    <button class="nav-link" data-route="create">Create</button>
  </nav>
  <div class="header-actions">
    <label class="search-pill"><span class="search-glyph">⌕</span><input id="globalSearch" type="search" placeholder="Search items, collections, creators" autocomplete="off"><kbd>/</kbd></label>
    <button class="btn btn-portfolio" data-route="portfolio"><span class="tiny-grid">▦</span> Portfolio</button>
    <button class="btn btn-dark" id="walletButton"><span class="wallet-dot"></span><span id="walletButtonText">Connect wallet</span></button>
    <button class="mobile-menu" id="mobileMenu" aria-label="Toggle navigation">☰</button>
  </div>
</header>
<div class="network-strip" id="networkStrip"><span class="status-pulse"></span><span id="networkStatusText">Connecting to Gno.land…</span><span class="network-separator">·</span><span id="networkHeight">Live registry</span><a href="https://gnoscan.io/" target="_blank" rel="noreferrer">Gnoscan ↗</a></div>
<main id="mainContent" class="main-shell" aria-live="polite">
  <section class="loading-shell"><div class="loading-mark">m.</div><p>Gathering the good stuff…</p></section>
</main>
<footer class="site-footer">
  <div class="footer-brand"><span class="brand-mark small"><span></span></span><strong>morrow.</strong><span class="footer-line"></span><span>A little more meaning in every collectible.</span></div>
  <div class="footer-links"><a href="https://gno.land/" target="_blank" rel="noreferrer">Gno.land ↗</a><a href="https://gnoscan.io/" target="_blank" rel="noreferrer">Gnoscan ↗</a><a href="https://adena.app/" target="_blank" rel="noreferrer">Adena ↗</a><a href="https://guardians.family/" target="_blank" rel="noreferrer">Guardians ↗</a></div>
  <div class="footer-note">Non-custodial by design. Your keys never leave Adena.</div>
</footer>
<div id="modalHost"></div>
<div id="toastRegion" class="toast-region" aria-live="polite"></div>
</body>
</html>
